services:
  - type: web
    name: irdr-workflow
    runtime: node
    plan: free
    buildCommand: |
      npm install && cd frontend && npm run build && cd ../backend && npx prisma generate && npm run build
    startCommand: |
      cd backend && npx prisma migrate deploy && node dist/index.js
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        value: file:/opt/render/project/data/irdr.db
      - key: JWT_SECRET
        generateValue: true
      - key: PORT
        value: "10000"
    disk:
      name: irdr-data
      mountPath: /opt/render/project/data
      sizeGB: 1
