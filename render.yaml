services:
  - type: web
    name: irdr-workflow
    runtime: node
    plan: free
    buildCommand: |
      cd frontend && npm install && npx tsc && npx vite build && cd ../backend && npm install && npx prisma generate && npx tsc
    startCommand: |
      cd backend && mkdir -p data && npx prisma migrate deploy && npx tsx prisma/seed.ts && node dist/index.js
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: "20"
      - key: DATABASE_URL
        value: file:./data/irdr.db
      - key: JWT_SECRET
        generateValue: true
      - key: PORT
        value: "10000"
